[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-router"
version = "0.1.0"
description = "comPASS sibling engine: Graph / Probe / Route planes for capability-aware model routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.0"]
hf = []
sdk = ["httpx>=0.27"]

[project.scripts]
compass-proxy = "compass.serve.proxy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compass = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
