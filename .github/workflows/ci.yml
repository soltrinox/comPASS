name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install + pytest (native)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          python -m pytest tests -q --ignore=tests/test_wasmer_parity.py

  core-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - name: Build WASM artifacts
        working-directory: wasmer/crate
        run: |
          cargo build --release --target wasm32-wasip1 --bin compass-decide
          cargo build --release --target wasm32-unknown-unknown --lib
          mkdir -p ../artifacts
          cp target/wasm32-wasip1/release/compass-decide.wasm ../artifacts/
          cp target/wasm32-unknown-unknown/release/compass_core.wasm ../artifacts/compass_core_bg.wasm
          cp target/wasm32-unknown-unknown/release/compass_core.wasm ../artifacts/compass_core.wasm
          shasum -a 256 ../artifacts/*.wasm | tee ../artifacts/SHA256SUMS
      - name: Install Wasmer
        run: |
          set -euo pipefail
          # get.wasmer.io is often unreachable from GHA; install from GitHub Releases.
          VERSION="v7.4.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ASSET="wasmer-linux-amd64.tar.gz" ;;
            aarch64|arm64) ASSET="wasmer-linux-aarch64.tar.gz" ;;
            *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          URL="https://github.com/wasmerio/wasmer/releases/download/${VERSION}/${ASSET}"
          mkdir -p "$HOME/.wasmer/bin" /tmp/wasmer-extract
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 300 \
            -o /tmp/wasmer.tgz "$URL"
          tar -xzf /tmp/wasmer.tgz -C /tmp/wasmer-extract
          BIN="$(find /tmp/wasmer-extract -type f -name wasmer | head -n1)"
          test -n "$BIN"
          install -m 755 "$BIN" "$HOME/.wasmer/bin/wasmer"
          WASMER_BIN="$HOME/.wasmer/bin"
          test -x "$WASMER_BIN/wasmer"
          echo "$WASMER_BIN" >> "$GITHUB_PATH"
          echo "WASMER_BIN=$WASMER_BIN" >> "$GITHUB_ENV"
          "$WASMER_BIN/wasmer" --version
      - name: Instantiate + decide fixture
        run: |
          set -euo pipefail
          export PATH="${WASMER_BIN:-$HOME/.wasmer/bin}:$PATH"
          command -v wasmer
          wasmer --version
          wasmer validate wasmer/artifacts/compass_core_bg.wasm
          wasmer run wasmer/artifacts/compass-decide.wasm --volume "$PWD/wasmer:/wasmer" -- \
            --request "implement a function" \
            --snapshot /wasmer/fixtures/snapshot_min.json \
            --now "2026-09-05T00:00:00Z" | tee /tmp/wasm-decide.json
          grep -q 'urn:mg:model:cheap' /tmp/wasm-decide.json
      - name: Browser module has no fetch/keys imports
        run: |
          set -euo pipefail
          export PATH="${WASMER_BIN:-$HOME/.wasmer/bin}:$PATH"
          wasmer inspect wasmer/artifacts/compass_core_bg.wasm | tee /tmp/inspect.txt
          ! grep -E 'fetch|keys' /tmp/inspect.txt
          test -f wasmer/browser/index.html
          test -f wasmer/browser/sandbox.js
          test -f wasmer/browser/package.json
          test -x wasmer/desktop/run-decide.sh
      - name: Artifact SHA256SUMS + size budget
        run: |
          python3 scripts/wasmer_size_budget.py
          test -f test-results/j-wasmer-packaging/size-budget.json
      - name: Desktop shell packaging smoke
        run: |
          set -euo pipefail
          export PATH="${WASMER_BIN:-$HOME/.wasmer/bin}:$PATH"
          ./wasmer/desktop/run-decide.sh | tee /tmp/desktop-decide.json
          grep -q 'urn:mg:model:cheap' /tmp/desktop-decide.json
          COMPASS_FAIL_OPEN_DEMO=missing ./wasmer/desktop/run-decide.sh | tee /tmp/desktop-missing.json
          grep -q 'snapshot_missing' /tmp/desktop-missing.json

  fail-open-parity:
    runs-on: ubuntu-latest
    needs: [core-wasm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - name: Install Wasmer
        run: |
          set -euo pipefail
          # get.wasmer.io is often unreachable from GHA; install from GitHub Releases.
          VERSION="v7.4.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ASSET="wasmer-linux-amd64.tar.gz" ;;
            aarch64|arm64) ASSET="wasmer-linux-aarch64.tar.gz" ;;
            *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          URL="https://github.com/wasmerio/wasmer/releases/download/${VERSION}/${ASSET}"
          mkdir -p "$HOME/.wasmer/bin" /tmp/wasmer-extract
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 300 \
            -o /tmp/wasmer.tgz "$URL"
          tar -xzf /tmp/wasmer.tgz -C /tmp/wasmer-extract
          BIN="$(find /tmp/wasmer-extract -type f -name wasmer | head -n1)"
          test -n "$BIN"
          install -m 755 "$BIN" "$HOME/.wasmer/bin/wasmer"
          WASMER_BIN="$HOME/.wasmer/bin"
          test -x "$WASMER_BIN/wasmer"
          echo "$WASMER_BIN" >> "$GITHUB_PATH"
          echo "WASMER_BIN=$WASMER_BIN" >> "$GITHUB_ENV"
          "$WASMER_BIN/wasmer" --version
      - name: Build WASM artifacts
        run: |
          set -euo pipefail
          cd wasmer/crate
          cargo build --release --target wasm32-wasip1 --bin compass-decide
          mkdir -p ../artifacts
          cp target/wasm32-wasip1/release/compass-decide.wasm ../artifacts/
      - name: Install Python package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Fail-open parity (native vs wasm)
        run: |
          set -euo pipefail
          export PATH="${WASMER_BIN:-$HOME/.wasmer/bin}:$PATH"
          command -v wasmer
          python scripts/wasmer_parity.py
          python -m pytest tests/test_wasmer_parity.py -q
          test -f test-results/wasmer-parity/parity.json

  # Mobile Wasmer device matrix: explicit NOT_RUN (no device farm in CI).
  # Desktop packaged shell + browser headless covered elsewhere (wasmer-browser.yml / desktop/).
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert mobile NOT_RUN docs present
        run: |
          test -f wasmer/mobile/NOT_RUN.md
          test -f wasmer/desktop/run-decide.sh
          echo "mobile Wasmer target: NOT_RUN — see wasmer/mobile/NOT_RUN.md"
          echo "Desktop shell: wasmer/desktop/run-decide.sh (packaged beyond raw wasm bytes)"
          echo "Browser headless: workflow wasmer-browser.yml"
