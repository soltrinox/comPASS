worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

  map $arg_url $circuit_proxy_ok {
    default 0;
    "~*^https://raw\.githubusercontent\.com/" 1;
    "~*^https://github\.com/" 1;
    "~*^https://objects\.githubusercontent\.com/" 1;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index challenge.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' http://127.0.0.1:8791 http://localhost:8791 https://raw.githubusercontent.com https://github.com https://objects.githubusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" always;

    location = / {
      return 302 /challenge.html;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    location /artifacts/ {
      alias /usr/share/nginx/artifacts/;
      add_header Cross-Origin-Resource-Policy cross-origin always;
      types { application/wasm wasm; }
    }

    location = /circuit-proxy {
      if ($circuit_proxy_ok = 0) { return 403; }
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      set $upstream_url $arg_url;
      proxy_pass $upstream_url;
      proxy_hide_header Content-Security-Policy;
      add_header Access-Control-Allow-Origin * always;
      add_header Cross-Origin-Resource-Policy cross-origin always;
      add_header Cache-Control "public, max-age=60";
    }

    location = /healthz {
      default_type application/json;
      return 200 '{"ok":true,"service":"browser-client"}';
    }
  }
}
