[package]
name = "compass-core"
version = "0.1.0"
edition = "2021"
description = "comPASS Route+Graph read core for Wasmer / browser WASM (Track D)"
license = "MIT"
publish = false

[lib]
name = "compass_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "compass-decide"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
